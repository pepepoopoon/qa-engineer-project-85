
---
- summary: |
    Успешная авторизация через GitHub
  requirement: |
    Пользователь должен иметь возможность авторизоваться через GitHub
  prerequisites: |
    Пользователь не авторизован в Codebattle
    У пользователя есть действующий аккаунт GitHub
    В браузере активна сессия GitHub; вход в Codebattle ранее разрешён этому аккаунту
  test-data: |
    Действующий аккаунт GitHub
  steps:
    - Открыть страницу Codebattle
    - Нажать Sign in
    - Нажать Sign in with Github
  expected-result: |
    Пользователь успешно авторизован в Codebattle
    В интерфейсе отображается его имя пользователя

- summary: |
    Успешное создание игры против бота
  requirement: |
    Пользователь должен иметь возможность играть против бота
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Тип игры - Bot
    Уровень сложности - Elementary
  steps:
    - Нажать Create battle
    - Выбрать уровень Elementary
    - Выбрать тип игры Bot
    - Нажать Create battle в форме
  expected-result: |
    Создаётся новая игра против бота
    Открывается игровой интерфейс с задачей и редактором кода

- summary: |
    Выбор уровня сложности при создании игры
  requirement: |
    Пользователь должен иметь возможность выбирать уровень сложности игры
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Уровень сложности - Hard
    Тип игры - Bot
    Задача - Random task
    Время игры - 1 min
  steps:
    - Нажать Create battle
    - Выбрать уровень Hard, тип Bot и время 1 min
    - Оставить случайный выбор задачи
    - Нажать Create battle в форме
    - Проверить уровень задачи в созданной игре
  expected-result: |
    Создана игра против бота
    В игровой области у задачи указан уровень Hard

- summary: |
    Выбор конкретной задачи при создании игры
  requirement: |
    Пользователь должен иметь возможность выбирать конкретную задачу
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Уровень сложности - Elementary
    Тип игры - Bot
    Задача - rect_area
  steps:
    - Нажать Create battle
    - Выбрать уровень Elementary и тип Bot
    - Открыть список задач и выбрать rect_area
    - Нажать Create battle в форме
    - Проверить название и условие задачи в созданной игре
  expected-result: |
    Создана игра с задачей rect_area
    В условии требуется вычислить площадь прямоугольника по ширине и длине

- summary: |
    Переключение языка программирования в игре
  requirement: |
    Пользователь должен иметь возможность выбирать язык программирования
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра
  test-data: |
    Язык программирования - Python
  steps:
    - Открыть список языков программирования
    - Выбрать Python
  expected-result: |
    В редакторе выбран язык Python
    Отображается шаблон решения для Python

- summary: |
    Редактирование кода в игровом редакторе
  requirement: |
    Пользователь должен иметь возможность писать и редактировать код в редакторе
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра
  test-data: |
    Язык программирования - JavaScript
    Тестовый код - const x = 10;
  steps:
    - Выбрать JavaScript
    - Ввести тестовый код в редактор
    - Изменить значение переменной с 10 на 20
  expected-result: |
    В редакторе отображается изменённый код
    Изменения сохраняются в текущем содержимом редактора

- summary: |
    Запуск тестов для проверки решения
  requirement: |
    Пользователь должен иметь возможность запускать тесты для проверки решения
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра против бота с задачей rect_area и языком Python
  test-data: |
    Задача - rect_area
    Язык - Python
    Неправильное решение - def solution(width, length): return 0
  steps:
    - Ввести неправильное решение в редактор
    - Нажать Run
  expected-result: |
    Запускается проверка решения
    Отображаются результаты выполнения тестов

- summary: |
    Отображение результата проверки неправильного решения
  requirement: |
    При неправильном решении задачи пользователь должен получать информацию о результатах проверки
  prerequisites: |
    Открыта активная игра против бота с задачей rect_area и языком Python
    В редакторе введено неправильное решение
  test-data: |
    Задача - rect_area
    Язык - Python
    Неправильное решение - def solution(width, length): return 0
  steps:
    - Нажать Run
    - Дождаться завершения проверки
  expected-result: |
    Пользователь получает информацию о неуспешной проверке решения

- summary: |
    Отправка сообщения в игровой чат
  requirement: |
    Пользователь должен иметь возможность общаться в чате
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра против бота с доступным чатом
  test-data: |
    Сообщение - Hello!
  steps:
    - Ввести Hello! в поле чата
    - Отправить сообщение
  expected-result: |
    Отправленное сообщение отображается в игровом чате

- summary: |
    Просмотр рейтинга пользователей
  requirement: |
    Пользователь должен иметь возможность просматривать рейтинг игроков
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта главная страница приложения
  test-data: |
    Не требуются
  steps:
    - Перейти в раздел рейтинга пользователей
  expected-result: |
    Открывается раздел рейтинга
    Отображается список пользователей с показателями рейтинга

- summary: |
    Создание игры с другим пользователем и присоединение соперника
  requirement: |
    Пользователь должен иметь возможность создавать игру против другого пользователя
    Другой пользователь должен иметь возможность присоединиться к ожидающей игре
  prerequisites: |
    Пользователи A и B авторизованы в двух независимых сессиях Codebattle
    У обоих открыта страница Lobby, нет активной игры
    Оба аккаунта принадлежат тестировщикам
  test-data: |
    Пользователь A - pepepoopoon
    Пользователь B - pepepoopoon_qa
    Тип игры - Random player
    Уровень сложности - Elementary
    Задача - rect_area
  steps:
    - Пользователю A нажать Create battle
    - Выбрать Random player, Elementary и задачу rect_area
    - Создать игру и оставить её в ожидании соперника
    - Пользователю B открыть Join a battle
    - Найти ожидающую игру пользователя A и нажать Fight
    - В обеих сессиях проверить участников, задачу и запуск таймера
  expected-result: |
    Пользователь B присоединился к созданной пользователем A игре
    В обеих сессиях открыта одна игра с задачей rect_area
    Отображаются пользователи A и B, их редакторы и запущенный таймер

- summary: |
    Создание игры с другом и присоединение по приглашению
  requirement: |
    Пользователь должен иметь возможность создавать игру с другом и приглашать его в неё
    Приглашённый друг должен иметь возможность присоединиться к игре
  prerequisites: |
    Пользователи A и B авторизованы в двух независимых сессиях Codebattle
    У обоих открыта страница Lobby, нет активной игры
    Оба аккаунта принадлежат тестировщикам, пользователь B доступен в списке соперников
  test-data: |
    Пользователь A - pepepoopoon
    Пользователь B - pepepoopoon_qa
    Тип игры - With a friend
    Уровень сложности - Elementary
    Задача - rect_area
  steps:
    - Пользователю A нажать Create battle
    - Выбрать With a friend, Elementary и задачу rect_area
    - В Choose opponent выбрать пользователя B
    - Нажать Send invite
    - Пользователю B дождаться уведомления Battle invite от пользователя A
    - В уведомлении нажать Accept
    - В обеих сессиях проверить участников, задачу и запуск таймера
  expected-result: |
    Приглашение доставлено пользователю B
    После принятия приглашения в обеих сессиях открыта одна игра с задачей rect_area
    Отображаются пользователи A и B, их редакторы и запущенный таймер

- summary: |
    Победа после отправки правильного решения
  requirement: |
    После успешного прохождения тестов система должна определять победителя и проигравшего
  prerequisites: |
    Пользователь авторизован в Codebattle
    Создана активная игра против бота с задачей rect_area, Elementary, временем 8 min
    Бот ещё не завершил задачу
  test-data: |
    Язык - Python
    Правильное решение - def solution(width, length): return width * length
  steps:
    - Выбрать Python
    - Ввести правильное решение
    - Нажать Run до завершения задачи ботом
    - Дождаться завершения проверки
  expected-result: |
    Все 30 тестов пройдены
    Игра завершена, пользователю показано You won!
    У пользователя указан результат Won, у бота - Lost

- summary: |
    Поражение после победы соперника
  requirement: |
    После успешного прохождения тестов система должна определять победителя и проигравшего
  prerequisites: |
    Пользователь авторизован в Codebattle
    Создана активная игра против бота с задачей rect_area, Elementary, временем 8 min
  test-data: |
    Язык - Python
    Неправильное решение - def solution(width, length): return 0
  steps:
    - Ввести неправильное решение и нажать Run
    - Убедиться, что часть тестов не пройдена
    - Не отправлять правильное решение и дождаться успешного решения бота
  expected-result: |
    После прохождения ботом всех тестов игра завершена
    Пользователю показано You lost
    У пользователя указан результат Lost, у бота - Won

- summary: |
    Завершение игры по истечении времени
  requirement: |
    При истечении установленного времени игра должна завершаться с соответствующим сообщением
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Тип игры - Bot
    Уровень сложности - Hard
    Время игры - 1 min
    Задача - Random task
  steps:
    - Нажать Create battle
    - Выбрать Bot, Hard, время 1 min и случайную задачу
    - Создать игру
    - Не отправлять решение и дождаться окончания таймера
  expected-result: |
    По истечении одной минуты игра завершена
    Отображается сообщение Time is over

- summary: |
    Завершение игры после сдачи пользователя
  requirement: |
    Пользователь должен иметь возможность сдаться и увидеть результат завершённой игры
  prerequisites: |
    Пользователь авторизован в Codebattle
    Создана активная игра против бота с задачей уровня Elementary и временем 8 min
    Ни один участник ещё не решил задачу
  test-data: |
    Действие - Give up
  steps:
    - Открыть меню More своего редактора
    - Выбрать Give up
    - В диалоге Give up? подтвердить действие кнопкой Give up
  expected-result: |
    Игра завершена, пользователю показано You gave up
    У пользователя указан результат Gave up, у бота - Won
