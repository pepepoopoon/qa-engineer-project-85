---
functional:
  - Пользователь должен иметь возможность авторизоваться через GitHub
  - Пользователь должен иметь возможность создавать новую игру
  - Пользователь должен иметь возможность играть против другого пользователя или бота
  - Пользователь должен иметь возможность создавать игру по ссылке для друга
  - Пользователь должен иметь возможность выбирать уровень сложности и задачу
  - Пользователь должен иметь возможность выбирать язык программирования
  - Пользователь должен иметь возможность писать и редактировать код в редакторе
  - Пользователь должен иметь возможность запускать тесты для проверки решения
  - Игроки должны видеть изменения кода соперника во время игры
  - Пользователь должен иметь возможность общаться в чате
  - Пользователь должен иметь возможность просматривать рейтинг и историю игр
non-functional:
  - Сайт должен быть разработан с учётом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователей
  - Сайт должен быть удобным для использования на мобильном устройстве
  - Сайт должен быть совместим с последними версиями браузеров
  - Сайт должен выдерживать большое количество трафика, например 1000 одновременных пользователей
implicit:
  - При неправильном решении задачи пользователь должен получать информацию о результатах проверки
  - После успешного прохождения тестов система должна определять победителя
  - После завершения игры её результат должен сохраняться в истории
  - При потере соединения пользователь должен получать уведомление о проблеме
